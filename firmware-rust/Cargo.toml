[package]
name = "firmware-rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
esp32c3 = ["dep:esp-hal", "dep:esp-backtrace", "dep:esp-println"]
stm32f103 = ["dep:stm32f1xx-hal", "dep:panic-halt", "dep:cortex-m", "dep:cortex-m-rt"]

[dependencies]
log = "0.4.22"

# ESP32-C3 dependencies
esp-hal = { version = "0.23.1", features = ["esp32c3"], optional = true }
esp-backtrace = { version = "0.15.0", features = ["esp32c3", "exception-handler", "panic-handler", "println"], optional = true }
esp-println = { version = "0.13.0", features = ["esp32c3", "log"], optional = true }

# STM32F103 dependencies
stm32f1xx-hal = { version = "0.10.0", features = ["rt", "stm32f103", "medium"], optional = true }
panic-halt = { version = "0.2.0", optional = true }
cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7.3", optional = true }

[lib]
name = "firmware_rust"
path = "src/lib.rs"

[[bin]]
name = "firmware-rust-esp32c3"
path = "src/main_esp32c3.rs"
required-features = ["esp32c3"]

[[bin]]
name = "firmware-rust-stm32f103"
path = "src/main_stm32f103.rs"
required-features = ["stm32f103"]
