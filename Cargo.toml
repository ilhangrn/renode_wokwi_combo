[package]
name = "esp32-rust-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-alloc = "0.6.0"
esp-backtrace = { version = "0.15.0", features = ["esp32", "panic-handler", "print-uart"] }
esp-hal = { version = "0.23.1", features = ["esp32"] }
esp-println = { version = "0.13.0", features = ["esp32", "log"] }
log = "0.4.22"

[profile.release]
opt-level = "s" # Optimize for binary size
