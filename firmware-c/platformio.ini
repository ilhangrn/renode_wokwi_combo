[platformio]
default_envs = esp32-c3-devkitm-1, stm32f103_bluepill

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Keep debug symbols and a debug-friendly optimization level for GDB stepping
build_unflags = -Os
build_flags = -Og -g3
lib_deps =
    throwtheswitch/Unity@^2.5.2
build_src_filter = +<*> -<main_stm32f103.cpp>

[env:stm32f103_bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
build_flags = -Og -g3
lib_deps =
    throwtheswitch/Unity@^2.5.2
build_src_filter = +<*> -<main_esp32c3.cpp>
