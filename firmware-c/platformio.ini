[platformio]
default_envs = esp32-c3-devkitm-1, stm32f103_bluepill

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Keep debug symbols and a debug-friendly optimization level for GDB stepping
build_unflags = -Os
build_flags = -Og -g3
build_src_filter = +<*> -<main_stm32f103.c>

[env:stm32f103_bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
monitor_speed = 115200
build_flags = -Og -g3
build_src_filter = +<*> -<main_esp32c3.cpp>
